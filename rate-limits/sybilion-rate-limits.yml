  evidence:
    - { url: 'https://api.sybilion.dev/api/v1/me', status: 401, note: 'no rate-limit header of any kind' }
    - { url: 'https://api.sybilion.dev/health', status: 405, note: 'HEAD not allowed; Allow: GET; no rate-limit header' }
status_code: 429
discrimination:
  method: substring match on the error message
  machine_readable: false
  note: >-
    The docs themselves instruct callers to distinguish per-minute exhaustion from concurrency
    exhaustion by reading the message text, because both return 429 with the same envelope.
interaction_with_billing: >-
  The concurrency cap and the balance hold are separate gates. A caller can get 429 for concurrency
  with a healthy balance, or 402 on available balance with zero running jobs while holds settle.
