note: >-
  Three independent caps are documented by SHAPE, and none by VALUE. The docs say every number is
  tier-dependent and shown only in the Developers Portal, so limit_count is an honest 0 — the caps
  are real, the figures are behind the login. Worse for an agent: there are NO rate-limit response
  headers at all. Headers were observed live on two anonymous responses (401 on /api/v1/me and 405
  on /health) and the only Sybilion-set header is x-trace-id; the rest are Cloudflare and CORS. With
  no RateLimit-*, no X-RateLimit-*, and no Retry-After, a client that hits 429 has to guess its
  backoff, and has to substring-match the message body to learn WHICH cap it hit.
limits:
  - scope: per-key/per-account
    name: Requests per minute (general)
    window: 60s
    limit: null
    burst: null
    applies_to: every authenticated /api/v1/* request other than forecasts and drivers
    tier_dependent: true
    status_on_exhaustion: 429
    source: https://sybilion.dev/docs/errors
  - scope: per-key/per-account
    name: Requests per minute (synchronous billed)
    window: 60s
    limit: null
    burst: null
    applies_to: ['POST /api/v1/drivers', 'POST /api/v1/alerts']
    tier_dependent: true
    status_on_exhaustion: 429
    signal: 'message contains "rate limit"'
    source: https://sybilion.dev/docs/errors
  - scope: per-account
    name: Concurrent forecast jobs
    window: concurrent
    limit: null
    burst: null
    applies_to: ['POST /api/v1/forecasts']
    counts: in-flight jobs with status queued or running
    tier_dependent: true
    status_on_exhaustion: 429
    signal: 'message contains "too many concurrent jobs"'
    evaluated: before the balance hold is taken
    source: https://sybilion.dev/docs/errors
response_headers:
  rate_limit_headers: none
  ratelimit_draft: false
  x_ratelimit: false
  retry_after: false
  observed_headers_on_429: not observed (429 not reproducible anonymously)
  observed_headers_anonymous:
