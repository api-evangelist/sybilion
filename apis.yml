image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/sybilion.png
name: Sybilion
description: >-
  Sybilion is a decision layer for industrial companies, providing economic and causal forecasting
  that connects external market dynamics to internal exposure for procurement, trading and risk
  teams. It forecasts monthly business time series up to twelve months ahead with 80% and 90%
  quantile bands, ranks the external macroeconomic drivers that move a series with Granger lag
  relationships and feature-importance scores, backtests against the last twelve months, and raises
  alerts on the market movements turning relevant to a customer's exposure right now. The same
  causal model is reachable two ways: an anonymously-specified OpenAPI 3.0.3 REST API at
  api.sybilion.dev using Bearer API keys, and a hosted OAuth MCP server at mcp.sybilion.dev that
  ChatGPT, Claude and the TradingView Remix extension connect to directly. Billing is a prepaid
  EUR-cent balance with expiring credit tranches and pre-flight holds. Official Python, Go,
  TypeScript and R SDKs are published.
