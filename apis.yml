apis:
  - name: Sybilion Operational API
    description: >-
      REST API exposing asynchronous forecasts with quantile bands and driver attribution, ranked
      external drivers, alerts, the region/category catalog, account balance and tier, and paginated
      billing history. OpenAPI 3.0.3 with 11 operations and 22 schemas, served anonymously at
      https://api.sybilion.dev/openapi.yaml. Uses HTTP Bearer authentication with API keys
      (sk_ops_...) or Auth0 JWT session tokens. Forecasts are async (202 + job_id, poll, download
      artifacts); drivers and alerts are synchronous and billed, with X-Request-ID retry dedupe.
    humanURL: https://sybilion.dev/docs/
    baseURL: https://api.sybilion.dev
