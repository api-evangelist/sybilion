apis:
- name: Sybilion MCP Server
  description: >-
    Hosted Streamable-HTTP MCP server providing agent-native tools for forecasts (submit_forecast, get_forecast,
    get_forecast_chart, get_forecast_artifact), alerts (get_alerts) and catalog discovery (list_regions,
    list_categories), with an OAuth 2.1 authorization-code + PKCE browser approval flow, RFC 8414 and
    RFC 9728 discovery documents and RFC 7591 dynamic client registration. Anonymous tools/list returns
    401, so live input schemas are auth-gated. Documented integrations include ChatGPT, Claude and the
    TradingView Remix extension. Notably exposes no tool for POST /api/v1/drivers.
  humanURL: https://sybilion.dev/docs/integrations
  baseURL: https://mcp.sybilion.dev/mcp
