clients_documented:
  - name: ChatGPT
    requirement: Developer Mode + Plus/Pro/Business/Enterprise/Edu plan
    setup: Settings -> Apps -> Advanced settings -> Create App, Connector URL https://mcp.sybilion.dev/mcp, OAuth
    note: write-tool calls require per-call approval unless remembered for the session
  - name: Claude
    requirement: Pro or Max for individuals; Owner adds it org-wide for Team/Enterprise
    setup: Customize -> Connectors -> Add custom connector -> https://mcp.sybilion.dev/mcp
  - name: TradingView Remix
    requirement: Chrome extension with a built-in MCP client
    setup: Remix side panel -> Settings -> MCP Servers -> add https://mcp.sybilion.dev/mcp with OAuth
behaviour:
  async_polling: >-
    Forecast jobs are asynchronous. The connector paces the polling itself — submit_forecast returns
    a job id, the server polls get_forecast until the job completes, then the chart and artifacts are
    retrievable. Runs take tens of seconds to a few minutes.
  known_client_issue: >-
    The docs warn that some MCP clients pass tool arguments as a plain string instead of a structured
    dict, and publish the required argument shapes for get_forecast, get_forecast_chart and
    get_forecast_artifact as the workaround.
  scope_limit: >-
    Provider states plainly that only MONTHLY business time series are supported and that
    sub-monthly frequencies are roadmap, not in the public connector.
