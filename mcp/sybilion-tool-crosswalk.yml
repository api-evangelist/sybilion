crosswalk:
  - tool: submit_forecast
    category: forecasts
    rest: ['POST /api/v1/forecasts']
    binding: rest
    confidence: high
    note: >-
      Named in the provider's own tool-sequence diagram (submit_forecast -> get_forecast ->
      get_forecast_chart). The REST operation is the only submit surface and returns 202 with a
      job_id, which matches the documented async pattern exactly. Real input contract is
      ForecastRequestV1 (pipeline_version, frequency, recency_factor, timeseries_metadata,
      timeseries, plus one of soft_horizon/hard_horizon).
  - tool: get_forecast
    category: forecasts
    rest: ['GET /api/v1/forecasts/{id}']
    binding: rest
    confidence: high
    note: documented argument { job_id } maps to the path parameter id; response is JobSummary + ForecastArtifactMeta[]
  - tool: get_forecast_chart
    category: forecasts
    rest: ['GET /api/v1/forecasts/{id}/artifacts/{name}']
    binding: rest
    confidence: medium
    note: >-
      Composite. The tool takes only { job_id } but the REST operation requires an artifact name, so
      the server is selecting the chart artifact on the caller's behalf. There is no REST operation
      that returns a chart from a job id alone.
  - tool: get_forecast_artifact
    category: forecasts
    rest: ['GET /api/v1/forecasts/{id}/artifacts/{name}']
    binding: rest
    confidence: high
    note: documented arguments { job_id, artifact_name } map 1:1 onto the two path parameters
  - tool: get_alerts
