rest_only:
  - operation: 'POST /api/v1/drivers'
    capability: drivers
    note: >-
      The most notable divergence. Standalone driver ranking (RecommendRequestV1) is a first-class
      REST endpoint and is headlined on the marketing API page, but the MCP connector exposes no
      drivers tool — the MCP page instead routes driver attribution through
      get_forecast_artifact/external_signals.json, i.e. drivers only as a by-product of a forecast.
      An agent cannot rank drivers without paying for a forecast.
  - operation: 'GET /api/v1/me'
    capability: account
    note: >-
      Almost certainly reachable via the unnamed account tool the ChatGPT setup instructions refer
