note: >-
  Five named tiers are published; NOT ONE PRICE IS. There is no pricing page anywhere on either
  domain — https://www.sybilion.com/pricing returns 404 and https://sybilion.dev/pricing returns the
  SPA shell. The Tiers doc says outright that "your current tier and its live limits are shown in
  the Developers Portal Tiers Page", i.e. every number sits behind the Auth0 login. A prospective
  integrator cannot learn what a forecast costs, what a tier costs, or what any tier's limits are
  without signing up. What IS public is the billing MODEL, captured below, because it is legible
  from the API contract itself.
pricing_page: null
pricing_page_probed:
  - { url: 'https://www.sybilion.com/pricing', status: 404 }
  - { url: 'https://sybilion.dev/pricing', status: 200, verdict: 'SPA shell, no pricing content' }
model:
  type: prepaid-balance
  currency: EUR
  unit: integer EUR cents
  metering: per billed event (one usage_event row per async settlement or synchronous endpoint charge)
  balance_fields: [balance_eur_cents, available_eur_cents, lifetime_paid_cents]
  holds: >-
    POST /api/v1/forecasts reserves an estimated maximum cost as a hold before running; the hold is
    released and replaced by the actual charge at settlement. available_eur_cents = balance minus
    active holds.
  pre_check: >-
    POST /api/v1/drivers and POST /api/v1/alerts run a worst-case-ceiling pre-check and return 402
    with "need up to N, have M" when the available balance cannot cover it. filters.limit drives the
    ceiling.
  credit_expiry: >-
    Balance is held as EuroTranche lots with initial_eur_cents, remaining_eur_cents and expires_at —
    credits expire, though no expiry period is published.
  auto_recharge:
    exposed: true
    fields: [enabled, below_eur_cents, target_eur_cents, monthly_cap_cents, meter_cents, meter_month]
    processor: Stripe (has_stripe_customer)
  trial:
    exposed: true
    field: signup_trial
    terms: not published
  billed_endpoints: ['POST /api/v1/forecasts', 'POST /api/v1/drivers', 'POST /api/v1/alerts']
  free_endpoints: ['GET /api/v1/me', 'GET /api/v1/jobs', 'GET /api/v1/usage', 'GET /api/v1/regions', 'GET /api/v1/categories', 'GET /api/v1/forecasts/{id}', 'GET /api/v1/forecasts/{id}/artifacts/{name}', 'GET /health']
